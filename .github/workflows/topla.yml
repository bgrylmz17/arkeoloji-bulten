name: Bülteni topla

on:
  schedule:
    # Türkiye saatiyle 06:17, 12:17, 18:17, 00:17 (UTC+3)
    - cron: "17 3,9,15,21 * * *"
  workflow_dispatch: {}       # Actions sekmesinden "Run workflow" ile elle çalıştırma
  push:
    paths:
      - "toplayici/**"
      - "harrix_bulten/**"
      - "docs/ozel/**"           # Arkix Özel yazısı eklenince ya da değişince

permissions:
  contents: write

concurrency:
  group: topla
  cancel-in-progress: false

jobs:
  topla:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Doğal ses bileşeni (dünün özeti için)
        run: pip install --quiet edge-tts || echo "edge-tts kurulamadı; sesli özet bu sefer üretilmeyecek"
      - name: Kaynakları tara
        run: python toplayici/topla.py
      - name: Sonuçları kaydet
        run: |
          git config user.name "Harrix Bülten"
          git config user.email "actions@users.noreply.github.com"
          git add docs/veri
          if git diff --cached --quiet; then
            echo "Değişiklik yok."
          else
            git commit -m "Bülten güncellendi $(date -u +%Y-%m-%dT%H:%MZ)"
            # aynı anda iki toplama olursa yeni toplananın verisi geçerli olsun
            git pull --rebase --autostash -X theirs
            git push
          fi
